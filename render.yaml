# Render Infrastructure as Code (Blueprint)
# Specification for deploying WorkAI on Render Free Instances
# Documentation: https://render.com/docs/blueprint-spec

databases:
  - name: workai-postgres
    databaseName: workai
    user: workai_user
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: workai
    runtime: node
    plan: free
    region: oregon
    buildCommand: "npm install --include=dev && npx prisma generate && npm run build"
    startCommand: "node scripts/start-render.mjs"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: workai-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://workai.onrender.com
      - key: DEFAULT_AI_PROVIDER
        value: gemini
      - key: DEFAULT_AI_MODEL
        value: gemini-1.5-flash
      - key: ADMIN_EMAIL
        value: admin@workai.example.com
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADSENSE_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: COOKIE_CONSENT_ENABLED
        value: "true"
      - key: AFFILIATE_TRACKING_ENABLED
        value: "true"
